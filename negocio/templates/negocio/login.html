{% extends "negocio/base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-box panel">
    <h2>Entrar</h2>
    <p class="helptext">Use um dos usuários seed da base (ex.: candidato@cambara-teste.com.br).
    Senha padrão: <code>trocar_no_setup</code> — veja o README.</p>
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="id_email">E-mail</label>
        {{ form.email }}
      </div>
      <div class="field">
        <label for="id_senha">Senha</label>
        {{ form.senha }}
      </div>
      <button type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
