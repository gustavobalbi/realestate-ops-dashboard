name: Build e publica imagem Docker

# Builda a partir do Dockerfile e publica no GitHub Container Registry (ghcr.io) a cada
# push em master -- gratuito para repositório público, usa o GITHUB_TOKEN do próprio
# repositório, sem precisar criar/pagar um Azure Container Registry. O Azure Container
# App aponta pra essa imagem (ver README, seção "Deploy").
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
